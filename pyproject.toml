[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for tiny decision models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium[classic-control]>=0.29,<2", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
jev-bench = "jev_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
